name: release
run-name: ${{ github.ref_type == 'tag' && format('release {0}', github.ref_name) || 'release build' }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build
    if: github.repository == 'Aero-Apex/LarpCode-MacOS'
    runs-on: macos-14
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      OPENCODE_CHANNEL: prod
      LARPCODE_UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download/update.json
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_NOTARIZE_APPLE_ID: ${{ secrets.MACOS_NOTARIZE_APPLE_ID }}
      MACOS_NOTARIZE_TEAM_ID: ${{ secrets.MACOS_NOTARIZE_TEAM_ID }}
      MACOS_NOTARIZE_PASSWORD: ${{ secrets.MACOS_NOTARIZE_PASSWORD }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Resolve version
        id: version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be semver-like, got '$version'" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            if [[ "$tag" == "v1" ]]; then
              version="1.0.0"
            elif [[ "$tag" != "v$version" ]]; then
              echo "tag $tag does not match VERSION v$version (only v1 is accepted as an alias)" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "LARPCODE_VERSION=$version" >> "$GITHUB_ENV"
          echo "LARPCODE_TAG=v$version" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch Electron runtime
        run: bun run script/fetch-electron.ts

      - name: Build bundled CLI
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
          LARPCODE_DESKTOP_DISTRIBUTION: "1"
        run: bun run packages/cli/script/build.ts --single --baseline --skip-install

      - name: Build standalone CLI (arm64)
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
          LARPCODE_CLI_DISTRIBUTION: "1"
        run: bun run packages/cli/script/build.ts --single --baseline --skip-install --outdir=dist-cli-arm64

      - name: Build standalone CLI (x64)
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
          LARPCODE_CLI_DISTRIBUTION: "1"
          OPENCODE_TARGET: darwin-x64
        run: bun run packages/cli/script/build.ts --skip-install --outdir=dist-cli-x64

      - name: Build desktop
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
        run: bun run --cwd packages/desktop build

      - name: Package desktop DMG and ZIP
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
        run: bun run --cwd packages/desktop pack

      - name: Skip codesign and notarize
        if: env.MACOS_SIGN_IDENTITY == '' || env.MACOS_NOTARIZE_APPLE_ID == '' || env.MACOS_NOTARIZE_TEAM_ID == '' || env.MACOS_NOTARIZE_PASSWORD == ''
        run: echo "::notice::MACOS_* secrets are not set; skipping codesign/notarize (v1 binaries are unsigned)"

      - name: Codesign and notarize
        if: env.MACOS_SIGN_IDENTITY != '' && env.MACOS_NOTARIZE_APPLE_ID != '' && env.MACOS_NOTARIZE_TEAM_ID != '' && env.MACOS_NOTARIZE_PASSWORD != ''
        shell: bash
        run: |
          artifacts="$(find packages/desktop/dist -type f \( -name '*.dmg' -o -name '*.zip' \) -print 2>/dev/null || true)"
          if [[ -z "$artifacts" ]]; then
            echo "::notice::No DMG/ZIP artifacts found under packages/desktop/dist; skipping codesign/notarize"
            exit 0
          fi
          while IFS= read -r artifact; do
            codesign --force --sign "$MACOS_SIGN_IDENTITY" --options runtime --timestamp "$artifact"
            xcrun notarytool submit "$artifact" \
              --apple-id "$MACOS_NOTARIZE_APPLE_ID" \
              --team-id "$MACOS_NOTARIZE_TEAM_ID" \
              --password "$MACOS_NOTARIZE_PASSWORD" \
              --wait
            xcrun stapler staple "$artifact"
          done <<< "$artifacts"

      - name: Stage macOS bundle
        run: bun run script/stage-macos.ts

      - name: Assemble release assets
        run: bun run script/release-assets.ts

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/release
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: build
    if: github.repository == 'Aero-Apex/LarpCode-MacOS' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist/release

      - name: Verify checksums
        working-directory: dist/release
        run: shasum -a 256 -c SHA256SUMS

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LarpCode macOS ${{ needs.build.outputs.version }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/release/LarpCode-macOS-universal.dmg
            dist/release/LarpCode-macOS-arm64.dmg
            dist/release/LarpCode-macOS-x64.dmg
            dist/release/LarpCode-macOS-universal.zip
            dist/release/larpcode*
            dist/release/install-cli.sh
            dist/release/cli.json
            dist/release/update.json
            dist/release/SHA256SUMS
            dist/release/LarpCode-macOS-${{ needs.build.outputs.version }}-source.zip
            dist/release/LarpCode-macOS-${{ needs.build.outputs.version }}-source.tar.gz
